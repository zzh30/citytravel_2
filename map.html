<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>目的地分布 · 城市周末</title>
  <meta name="description" content="在城市地图上查看周末目的地分布，点击标记或清单查看攻略。" />
  <style>
    :root {
      --bg: #FFFDF9;
      --surface: #FFFFFF;
      --ink: #1F2A37;
      --ink-soft: #5B6675;
      --muted: #8A94A6;
      --line: #ECE7DF;
      --brand: #F97316;
      --brand-ink: #C2410C;
      --accent: #0EA5A4;
      --radius: 16px;
      --radius-sm: 12px;
      --shadow: 0 18px 40px -18px rgba(31, 42, 55, .22);
      --shadow-sm: 0 6px 18px -10px rgba(31, 42, 55, .28);
      --maxw: 1160px;
      --navh: 61px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--ink);
      line-height: 1.6; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* 导航 */
    .nav {
      position: sticky; top: 0; z-index: 50; flex: none;
      background: rgba(255, 253, 249, .85);
      backdrop-filter: saturate(160%) blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .nav__inner {
      max-width: var(--maxw); margin: 0 auto; padding: 14px 24px;
      display: flex; align-items: center; gap: 24px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; }
    .brand__mark { font-size: 22px; }
    .nav__links { display: flex; gap: 26px; margin-left: auto; }
    .nav__links a { color: var(--ink-soft); font-weight: 600; font-size: 15px; padding: 6px 2px; position: relative; transition: color .2s; }
    .nav__links a:hover, .nav__links a.active { color: var(--ink); }
    .nav__links a.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--brand); border-radius: 2px; }
    .nav__cta {
      background: var(--brand); color: #fff; font-weight: 700; font-size: 14px;
      padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow-sm);
      transition: transform .2s, background .2s;
    }
    .nav__cta:hover { background: var(--brand-ink); transform: translateY(-1px); }

    /* 布局：左地图 + 右清单 */
    .map-layout { flex: 1; display: flex; min-height: 0; }
    .map-panel { flex: 1; min-width: 0; position: relative; }
    #map { width: 100%; height: 100%; background: #E8ECEF; }
    .map-hint {
      position: absolute; left: 16px; bottom: 16px; z-index: 5;
      background: rgba(255,255,255,.94); border: 1px solid var(--line);
      border-radius: 999px; padding: 7px 14px; font-size: 12.5px;
      color: var(--ink-soft); box-shadow: var(--shadow-sm);
    }

    .map-side {
      width: 372px; flex: none; overflow-y: auto;
      border-left: 1px solid var(--line); background: var(--bg);
      padding: 24px 20px 32px;
    }
    .map-side__head h1 { font-size: 24px; font-weight: 820; letter-spacing: -.5px; }
    .map-side__head p { color: var(--ink-soft); font-size: 14px; margin-top: 6px; }
    .map-side__count { display: inline-block; margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--brand-ink); background: rgba(249,115,22,.1); padding: 4px 12px; border-radius: 999px; }

    .city-list { list-style: none; margin-top: 18px; display: grid; gap: 10px; }
    .city-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-sm); padding: 12px 14px;
      box-shadow: var(--shadow-sm); cursor: pointer;
      transition: transform .18s, box-shadow .18s, border-color .18s;
    }
    .city-item:hover, .city-item.is-active {
      transform: translateY(-2px); border-color: var(--brand); box-shadow: var(--shadow);
    }
    .city-item__ph {
      width: 44px; height: 44px; flex: none; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; box-shadow: var(--shadow-sm);
    }
    .city-item__info { display: flex; flex-direction: column; min-width: 0; }
    .city-item__info strong { font-size: 16px; font-weight: 800; }
    .city-item__info em { font-style: normal; font-size: 12.5px; color: var(--muted); font-weight: 600; }
    .city-item__go { margin-left: auto; color: var(--brand); font-weight: 800; font-size: 15px; }

    /* 移动端：上下堆叠 */
    @media (max-width: 820px) {
      html, body { height: auto; }
      .nav__links { display: none; }
      .map-layout { flex-direction: column; }
      .map-panel { flex: none; height: 48vh; min-height: 300px; }
      #map { height: 100%; }
      .map-side { width: auto; border-left: none; border-top: 1px solid var(--line); overflow: visible; padding: 20px 16px 32px; }
      .map-hint { left: 12px; bottom: 12px; font-size: 12px; padding: 6px 12px; }
    }
  </style>

  <!-- 1. 代理配置必须在 SDK 之前设置（前端不暴露 key） -->
  <script type="text/javascript">
    window._TMapSecurityConfig = {
      serviceHost: 'http://127.0.0.1:__WB_HTTP_PORT__/_TMapService/_wbt/__WB_TMAP_SECRET__',
    };
  </script>
  <!-- 2. 从官方 CDN 加载腾讯地图 GL JS，不带 key 参数 -->
  <script src="https://map.qq.com/api/gljs?v=1.exp"></script>
</head>
<body>
  <header class="nav">
    <div class="nav__inner">
      <a class="brand" href="index.html">
        <span class="brand__mark">🧭</span>
        <span class="brand__name">城市周末</span>
      </a>
      <nav class="nav__links">
        <a href="index.html">首页</a>
        <a href="index.html#destinations">目的地</a>
        <a href="map.html" class="active">分布地图</a>
        <a href="index.html#inspiration">灵感</a>
        <a href="index.html#about">关于</a>
      </nav>
      <a class="nav__cta" href="index.html#destinations">全部目的地</a>
    </div>
  </header>

  <main class="map-layout">
    <section class="map-panel">
      <div id="map"></div>
      <div class="map-hint">点位为城市中心示意 · 点击标记查看攻略</div>
    </section>

    <aside class="map-side">
      <div class="map-side__head">
        <h1>目的地分布</h1>
        <p>点击地图标记或下方清单，查看对应城市的周末攻略。</p>
        <span class="map-side__count" id="city-count"></span>
      </div>
      <ul class="city-list" id="city-list"></ul>
    </aside>
  </main>

  <script>
    /* 目的地坐标（GCJ-02 城市中心近似值），与 data.js 的城市同源 */
    const CITIES = [
      { slug: "chengdu",   city: "成都", region: "四川", emoji: "🍜", season: "春秋", theme: ["#F97316", "#FB923C"], lat: 30.5728, lng: 104.0668 },
      { slug: "hangzhou",  city: "杭州", region: "浙江", emoji: "⛰️", season: "四季", theme: ["#0EA5A4", "#34D399"], lat: 30.2741, lng: 120.1551 },
      { slug: "xiamen",    city: "厦门", region: "福建", emoji: "🏝️", season: "春秋", theme: ["#0EA5E9", "#38BDF8"], lat: 24.4798, lng: 118.0894 },
      { slug: "dali",      city: "大理", region: "云南", emoji: "🌄", season: "春秋", theme: ["#8B5CF6", "#A78BFA"], lat: 25.6065, lng: 100.2676 },
      { slug: "chongqing", city: "重庆", region: "重庆", emoji: "🌃", season: "春秋", theme: ["#EF4444", "#F87171"], lat: 29.5630, lng: 106.5516 },
      { slug: "xian",      city: "西安", region: "陕西", emoji: "🏯", season: "春秋", theme: ["#F59E0B", "#FBBF24"], lat: 34.3416, lng: 108.9398 },
      { slug: "suzhou",    city: "苏州", region: "江苏", emoji: "🌿", season: "春秋", theme: ["#10B981", "#6EE7B7"], lat: 31.2989, lng: 120.5853 },
      { slug: "qingdao",   city: "青岛", region: "山东", emoji: "🍺", season: "夏秋", theme: ["#06B6D4", "#22D3EE"], lat: 36.0671, lng: 120.3826 },
    ];

    // 自定义标记图标（内联 SVG，data URI，避免引用外部图片）
    const pinSvg = (fill) =>
      "data:image/svg+xml," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="46" viewBox="0 0 36 46">' +
        '<path d="M18 1C8.6 1 1 8.6 1 18c0 12.4 17 27 17 27s17-14.6 17-27C35 8.6 27.4 1 18 1z" fill="' + fill + '" stroke="#ffffff" stroke-width="2"/>' +
        '<circle cx="18" cy="18" r="7" fill="#ffffff"/></svg>'
      );

    const goDetail = (slug) => { location.href = "destination.html?city=" + slug; };

    // ---- 渲染右侧清单 ----
    const listEl = document.getElementById("city-list");
    listEl.innerHTML = CITIES.map((c) => (
      '<li class="city-item" data-slug="' + c.slug + '" tabindex="0">' +
        '<span class="city-item__ph" style="background:linear-gradient(135deg,' + c.theme[0] + ',' + c.theme[1] + ')">' + c.emoji + '</span>' +
        '<span class="city-item__info"><strong>' + c.city + '</strong><em>' + c.region + ' · 最佳' + c.season + '</em></span>' +
        '<span class="city-item__go" aria-hidden="true">→</span>' +
      '</li>'
    )).join("");
    document.getElementById("city-count").textContent = "共 " + CITIES.length + " 个目的地";

    // ---- 初始化地图 ----
    const map = new TMap.Map("map", {
      center: new TMap.LatLng(32.5, 108.5), // 中国中部，一屏看全
      zoom: 5,
      viewMode: "2D",
    });

    // ---- 标记图层 ----
    const markers = new TMap.MultiMarker({
      map: map,
      styles: {
        default: new TMap.MarkerStyle({ width: 30, height: 38, anchor: { x: 15, y: 38 }, src: pinSvg("#F97316") }),
        active:  new TMap.MarkerStyle({ width: 40, height: 51, anchor: { x: 20, y: 51 }, src: pinSvg("#1F2A37") }),
      },
      geometries: CITIES.map((c) => ({
        id: c.slug,
        styleId: "default",
        position: new TMap.LatLng(c.lat, c.lng),
        properties: { slug: c.slug },
      })),
    });

    // 点击标记 → 打开详情
    markers.on("click", (e) => {
      const slug = e.geometry && e.geometry.id;
      if (slug) goDetail(slug);
    });

    // 高亮某个标记 + 清单项
    function setActive(slug, on) {
      const c = CITIES.find((x) => x.slug === slug);
      if (!c) return;
      markers.updateGeometries([{
        id: slug,
        styleId: on ? "active" : "default",
        position: new TMap.LatLng(c.lat, c.lng),
        properties: { slug: slug },
      }]);
      const item = listEl.querySelector('.city-item[data-slug="' + slug + '"]');
      if (item) item.classList.toggle("is-active", on);
    }

    // 清单：点击 → 打开详情；悬停 → 高亮地图标记
    listEl.addEventListener("click", (e) => {
      const item = e.target.closest(".city-item");
      if (item) goDetail(item.dataset.slug);
    });
    listEl.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const item = e.target.closest(".city-item");
      if (item) { e.preventDefault(); goDetail(item.dataset.slug); }
    });
    listEl.addEventListener("mouseover", (e) => {
      const item = e.target.closest(".city-item");
      if (item) setActive(item.dataset.slug, true);
    });
    listEl.addEventListener("mouseout", (e) => {
      const item = e.target.closest(".city-item");
      if (item) setActive(item.dataset.slug, false);
    });
  </script>
</body>
</html>
