  <section class="dhero" id="dhero">

    <div class="dhero__mask"></div>
    <div class="dhero__inner">
      <a class="dhero__back" id="hero-back" href="index.html">← 返回首页</a>
      <div class="dhero__meta">
        <span class="dhero__region" id="hero-region"></span>
        <span class="dhero__season" id="hero-season"></span>

      <h1 class="dhero__title">
        <span class="dhero__emoji" id="hero-emoji"></span>

      <p class="dhero__tagline" id="hero-tagline"></p>
      <div class="dhero__tags" id="hero-tags"></div>

      <div class="hl-grid" id="highlights"></div>

    <section class="detail__section">
      <h2 class="detail__h2">周末 2 天行程</h2>
      <div class="timeline" id="itinerary"></div>
    </section>

    <section class="detail__section">
      <h2 class="detail__h2">必吃美食</h2>
      <div class="food-grid" id="foods"></div>
    </section>

    <section class="detail__section">
      <h2 class="detail__h2">实用贴士</h2>
      <div class="tips-grid" id="tips"></div>
    </section>

    <section class="detail__section">
      <h2 class="detail__h2">周末还可以去</h2>
      <div class="more-grid" id="more"></div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__brand">
        <span class="brand__mark">🧭</span>
